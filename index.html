<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jisr · جسر</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233347FF'/%3E%3Cpath d='M6 22Q16 4 26 22M4 22h24' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FC;--card:#fff;--ink:#0E1A45;--muted:#5A6590;--line:#E0E5F4;
  --brand:#3347FF;--brand2:#6A4DFF;--brand-soft:#E8EBFF;--brand-ink:#2434D6;
  --mint:#0FA37F;--sun:#FFB020;--danger:#D9363E;--field:#F8F9FE;
  --shadow:0 1px 2px rgba(14,26,69,.05),0 14px 30px -18px rgba(14,26,69,.28);
  --font:'Plus Jakarta Sans','Cairo',system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Thai','Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Hebrew',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0A1130;--card:#121B45;--ink:#EEF1FF;--muted:#9BA6D8;--line:#243063;
    --brand:#5D6BFF;--brand-soft:#1D2860;--brand-ink:#B9C1FF;--mint:#35D2A9;--danger:#FF7A80;--field:#0E1640;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;min-height:100dvh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
bdi{unicode-bidi:isolate}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1.5px solid transparent;font-weight:700;cursor:pointer;background:transparent;transition:transform .15s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 22px -10px var(--brand)}
.btn.primary:disabled{opacity:.6;cursor:wait}
.btn.ghost{border-color:var(--line);background:var(--card)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink);min-height:40px;padding:0 16px;border-radius:12px;font-size:.92rem}
.btn.dangerous{color:var(--danger);min-height:40px;padding:0 14px;border-radius:12px;font-size:.92rem;border-color:transparent}
.btn.dangerous.sure{background:var(--danger);color:#fff}
.link{background:none;border:0;color:var(--brand-ink);font-weight:700;cursor:pointer;padding:8px 4px}
.link:disabled{color:var(--muted);cursor:default}
.fld{display:grid;gap:6px;position:relative}
.fld>span,.fld>.lab{font-size:.86rem;font-weight:700;color:var(--muted)}
input,textarea,select{width:100%;min-height:50px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--field);outline:none;transition:border-color .15s,box-shadow .15s}
textarea{padding:12px 14px;resize:vertical;min-height:90px}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.err{margin:0;min-height:1.3em;color:var(--danger);font-size:.9rem;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phone{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--field);border-radius:13px;transition:border-color .15s,box-shadow .15s}
.phone:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.phone bdi{padding:0 4px 0 14px;font-weight:800;color:var(--brand-ink);white-space:nowrap}
.phone input{border:0;background:transparent;box-shadow:none!important;min-width:0}
.langsel{width:auto;min-height:40px;padding:0 12px;border-radius:999px;background:var(--card);font-weight:600;font-size:.9rem;cursor:pointer}

/* ---------- combo box ---------- */
.combo{position:relative}
.combo ul{position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:30;margin:0;padding:6px;list-style:none;max-height:240px;overflow:auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 24px 40px -18px rgba(10,16,48,.45)}
.combo li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.combo li.on,.combo li:hover{background:var(--brand-soft)}
.combo li .lbl{flex:1}
.combo li .post{color:var(--muted);font-size:.85rem}
.combo li.grp{cursor:default;background:none!important;font-size:.76rem;font-weight:800;color:var(--muted);padding:10px 10px 4px;letter-spacing:.02em}
.combo li.none{cursor:default;color:var(--muted)}
.combo li.cust{color:var(--brand-ink)}

/* ---------- auth ---------- */
.auth{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{position:relative;overflow:hidden;color:#fff;padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(120% 90% at 85% 10%,#6A4DFF 0%,transparent 55%),linear-gradient(165deg,#111A5A 0%,#2230C4 70%,#3A44F0 100%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;position:relative;z-index:2}
.brand .ar{font-family:'Cairo',var(--font);font-weight:700;opacity:.8}
.brand svg{width:34px;height:34px}
.sun{position:absolute;inset-inline-end:12%;bottom:26%;width:min(26vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#FFB020 60%,#FF8A1F);filter:blur(.3px);opacity:.95}
.bridge{position:absolute;inset-inline:0;bottom:0;width:100%;height:46%}
.bridge path{fill:none;stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.hello-wrap{position:relative;z-index:2;margin-block-end:22%}
.hello{font-size:clamp(52px,8.5vw,120px);font-weight:800;line-height:1.05;letter-spacing:-.02em;transition:opacity .35s,transform .35s;min-height:1.2em}
.hello.out{opacity:0;transform:translateY(14px)}
.hello-wrap .tag{margin:10px 0 0;font-size:1.15rem;max-width:30ch;opacity:.9;font-weight:500}
.panel{display:flex;flex-direction:column;padding:20px 28px 32px}
.panel-top{display:flex;justify-content:flex-end}
.auth .card{margin:auto;width:min(430px,100%);background:var(--card);border-radius:26px;padding:30px;box-shadow:var(--shadow);border:1px solid var(--line)}
.auth h1{margin:0 0 18px;font-size:1.6rem;line-height:1.25}
.auth form{display:grid;gap:16px}
.sub{margin:-8px 0 0;color:var(--muted)}
.demo{background:color-mix(in srgb,var(--sun) 22%,transparent);border:1.5px dashed var(--sun);border-radius:14px;padding:10px 14px;font-weight:600}
.demo b{font-size:1.2rem;letter-spacing:.2em;margin-inline-start:6px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ---------- app ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .brand{color:var(--ink);font-size:1.15rem}
.top-end{display:flex;align-items:center;gap:10px}
.me{display:flex;align-items:center;gap:8px;font-weight:700}
.me span.nm{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-weight:800;background:hsl(var(--h,230) 85% 90%);color:hsl(var(--h,230) 55% 28%)}
@media (prefers-color-scheme:dark){.av{background:hsl(var(--h,230) 40% 26%);color:hsl(var(--h,230) 85% 86%)}}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:26px 20px 90px}
.greet{margin:0 0 18px;font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.2}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tab{display:flex;align-items:center;gap:10px;padding:16px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;text-align:start;transition:border-color .15s,background .15s}
.tab .t{flex:1;line-height:1.25}
.tab em{font-style:normal;min-width:28px;height:28px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--bg);font-size:.85rem}
.tab[aria-selected=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.tab[aria-selected=true] em{background:var(--brand);color:#fff}
.bar{display:flex;gap:10px;margin:16px 0}
.search{position:relative;flex:1}
.search .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-inline-start:44px}
.list{display:grid;gap:12px}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.item .main{flex:1;min-width:0}
.item h3{margin:0;font-size:1.1rem;line-height:1.3}
.item .who{margin:2px 0 8px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-size:.82rem;font-weight:700}
.chip.mine{background:color-mix(in srgb,var(--mint) 20%,transparent);color:var(--mint)}
.more{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.contact{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--field);border:1px solid var(--line);flex-wrap:wrap}
.contact bdi{font-weight:800;flex:1}
.contact a{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;text-decoration:none}
.contact a.call{background:var(--brand)}
.contact a.wa{background:#1FAF5A}
.empty{display:grid;justify-items:center;gap:14px;text-align:center;padding:48px 20px;color:var(--muted);border:2px dashed var(--line);border-radius:24px}
.empty svg{width:120px;height:60px;stroke:var(--brand);fill:none;stroke-width:3;stroke-linecap:round}
.empty p{margin:0;max-width:34ch;font-weight:600}



/* ---------- language gate & pill ---------- */
.lang-pill{position:fixed;top:14px;inset-inline-end:14px;z-index:40;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:14px;background:rgba(8,13,44,.74);backdrop-filter:blur(6px)}
.gate-card{width:min(660px,100%);max-height:94dvh;overflow:auto;background:var(--card);border-radius:26px;padding:24px;box-shadow:0 40px 80px -20px rgba(5,10,40,.6)}
.gate-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gate-card .brand{color:var(--ink)}
.gate-card h2{margin:14px 0 4px;font-size:1.7rem;line-height:1.2}
.gate-card .sub{margin:0}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin:18px 0}
.lang-opt{min-height:52px;padding:0 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);font-weight:700;cursor:pointer;transition:border-color .15s,background .15s}
.lang-opt:hover{border-color:var(--brand)}
.lang-opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}

/* ---------- app header / tabs / extras ---------- */
.me{background:none;border:0;cursor:pointer;border-radius:14px;padding:2px 4px}
.tabs{grid-template-columns:repeat(3,1fr)}
.tab em[hidden]{display:none}
.tab em.alert{background:var(--danger);color:#fff}
.bar .icon-btn{width:48px;height:48px;flex:none;border-radius:14px}
.icon-btn{color:var(--ink);text-decoration:none}
.icon-btn[aria-pressed=true]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand)}
.icon-btn[aria-pressed=true] svg{fill:currentColor}
.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item-head .star{width:38px;height:38px;flex:none}
.chip.wa{background:color-mix(in srgb,#1FAF5A 18%,transparent);color:#138a45;display:inline-flex;align-items:center;gap:5px}
.chip.wa .ic{width:14px;height:14px}
@media (prefers-color-scheme:dark){.chip.wa{color:#5fe39a}}
.btn.wa-btn{background:#1FAF5A;color:#fff}
a.btn{text-decoration:none}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:.92rem}
.phone .ic{margin-inline-start:14px;color:#1FAF5A}
.link.tiny{justify-self:start;padding:0;font-size:.85rem}
.muted{color:var(--muted)}

/* ---------- messages page ---------- */
.inbox{display:grid;grid-template-columns:300px 1fr;gap:12px;height:min(700px,calc(100dvh - 190px));min-height:480px}
.threads,.pane{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.th-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.th-head h3{margin:0;font-size:1.1rem}
.thread-list{overflow:auto;flex:1;padding:6px}
.thread,.person{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:14px;border:0;background:none;cursor:pointer;text-align:start}
.thread:hover,.thread.on,.person:hover{background:var(--brand-soft)}
.thread .av,.person .av{width:42px;height:42px;border-radius:13px}
.th-main{flex:1;min-width:0;display:grid;gap:2px}
.th-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.th-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-top time{font-size:.74rem;color:var(--muted);flex:none}
.th-last{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center}
.pane-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:20px;color:var(--muted)}
.pane-empty svg{width:76px;height:76px;stroke:var(--brand);fill:none;stroke-width:1.6}
.pane-chat{display:flex;flex-direction:column;flex:1;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-head .av{width:42px;height:42px;border-radius:13px}
.chat-head .chat-meta{flex:1;min-width:0}
.chat-head h3{margin:0;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head small{display:block;color:var(--muted);font-weight:600;direction:ltr;text-align:start}
.chat-head .back{display:none}
[dir=rtl] .chat-head .back svg{transform:scaleX(-1)}
.chat-head .wa-ic{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.chat-messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--bg) 72%,var(--card))}
.msg{max-width:78%;padding:9px 13px;border-radius:17px;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.msg .txt{white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.msg.theirs{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
[dir=rtl] .msg.mine{align-self:flex-start}[dir=rtl] .msg.theirs{align-self:flex-end}
.msg time{display:block;font-size:.68rem;opacity:.7;margin-top:3px}
.chat-empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:600}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;background:var(--card)}
.qchip{flex:none;border:1.5px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
.qchip:hover{border-color:var(--brand);color:var(--brand-ink)}
.chat-note{padding:6px 14px 0;font-size:.72rem;color:var(--muted);text-align:center;background:var(--card)}
.chat-compose{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 12px;background:var(--card)}
.chat-compose textarea{min-height:48px;height:48px;max-height:120px;resize:none;flex:1;padding-top:12px}
.chat-compose .icon-btn{width:48px;height:48px;border-radius:14px;flex:none}
.chat-compose .wa-send{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.chat-compose .btn{min-width:48px}
.dlg-body{display:grid;gap:14px;padding:24px}
.people-list{display:grid;gap:4px;max-height:36dvh;overflow:auto}
.person .chips{flex:none}
.numrow{display:flex;gap:8px}
.numrow .phone{flex:1}
@media (max-width:760px){
  .inbox{grid-template-columns:1fr;height:calc(100dvh - 170px)}
  .inbox .pane{display:none}
  .inbox.chat-open .threads{display:none}
  .inbox.chat-open .pane{display:flex}
  .chat-head .back{display:grid}
  .msg{max-width:88%}
  .tab{flex-direction:column;text-align:center;padding:10px 6px;gap:6px;position:relative}
  .tab .t{font-size:.82rem}
  .tab em{position:absolute;top:6px;inset-inline-end:6px;min-width:22px;height:22px;font-size:.75rem}
  .lang-grid{grid-template-columns:repeat(2,1fr)}
}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;border-radius:26px;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 40px 80px -20px rgba(5,10,40,.6);overflow:visible}
dialog::backdrop{background:rgba(8,13,44,.6);backdrop-filter:blur(3px)}
dialog form{display:grid;gap:14px;padding:24px}
dialog h3{margin:0;font-size:1.35rem}
.actions{display:flex;gap:10px;justify-content:flex-end}
.actions .btn{min-width:110px}
@media (max-width:600px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:26px 26px 0 0;max-height:94dvh;overflow:auto}
}

#toast{position:fixed;inset-inline:0;bottom:24px;display:flex;justify-content:center;pointer-events:none;z-index:100}
#toast span{background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transform:translateY(16px);transition:.25s}
#toast.show span{opacity:1;transform:none}

@media (max-width:860px){
  .auth{grid-template-columns:1fr}
  .hero{min-height:300px;padding:22px 24px}
  .hello-wrap{margin-block-end:60px}
  .hello{font-size:clamp(48px,16vw,84px)}
  .sun{width:120px;bottom:30%}
  .bridge{height:36%}
  .panel{padding:0 16px 28px;margin-top:-52px;position:relative;z-index:3}
  .panel-top{position:absolute;top:-286px;inset-inline-end:16px}
  .auth .card{padding:24px}
  .me .nm{display:none}
}
@media (max-width:520px){.tab{padding:12px;gap:8px}.tabs{gap:8px}.top{padding:10px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= v3: live data, estate, services, comments ================= */
.tabs{display:flex;gap:8px;overflow-x:auto;grid-template-columns:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 12px;gap:6px}
.tab .t{white-space:nowrap}
.chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font-weight:700;cursor:pointer}
.chip-btn .fl{font-size:1.2rem;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--field);padding:5px;border-radius:14px;margin-bottom:16px}
.seg button{min-height:42px;border:0;border-radius:10px;background:none;font-weight:800;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--brand-ink);box-shadow:var(--shadow)}
.fld select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);padding:0 12px;font:inherit}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chiprow button{min-height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font-weight:700;cursor:pointer}
.chiprow button[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.curbox{min-height:48px;display:grid;place-items:center;border-radius:14px;background:var(--field);border:1.5px dashed var(--line);font-weight:800;color:var(--muted);padding:0 12px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos .ph,.photos .addph{width:76px;height:76px;border-radius:14px;overflow:hidden;position:relative;border:1.5px solid var(--line);background:var(--field)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph button{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.photos .addph{display:grid;place-items:center;border-style:dashed;color:var(--brand-ink);cursor:pointer;font-size:1.8rem;font-weight:300}
.price{margin:2px 0 4px;font-weight:800;color:var(--brand-ink);font-size:1.05rem}
.item.media{display:block;padding:0;overflow:hidden}
.item.media .main{padding:14px 16px 16px}
.cover{display:block;width:100%;aspect-ratio:16/10;max-height:280px;object-fit:cover;background:var(--field);cursor:pointer}
.cover.ph{display:grid;place-items:center;color:var(--brand-ink);background:linear-gradient(135deg,var(--brand-soft),var(--field))}
.cover.ph .ic{width:46px;height:46px}
.item h3[data-open]{cursor:pointer}
dialog.tall{max-height:92dvh;overflow:auto}
dialog.big{width:min(700px,calc(100vw - 24px))}
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px}
.gallery img{flex:none;width:100%;max-height:340px;object-fit:cover;border-radius:16px;scroll-snap-align:center;background:var(--field)}
.gallery img:only-child{width:100%}
.owner-bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:14px}
.comments{display:grid;gap:10px}
.cm{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--field)}
.cm .av{width:34px;height:34px;border-radius:11px;flex:none;font-size:.9rem}
.cm-b{flex:1;min-width:0}
.cm-b b{margin-inline-end:8px}
.cm-b time{font-size:.74rem;color:var(--muted)}
.cm-b p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .x{border:0;background:none;color:var(--danger);font-size:1.2rem;cursor:pointer;line-height:1}
.tagp{display:inline-block;font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);vertical-align:middle}
.cform{display:flex;gap:8px;align-items:flex-end}
.cform textarea{flex:1;min-height:46px;height:46px;max-height:110px;resize:none;padding-top:11px}
.banner{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--sun) 22%,transparent);font-size:.85rem;font-weight:600;margin-bottom:14px}
.gate .lang-opt .fl{font-size:1.25rem;margin-inline-end:6px}
@media (max-width:560px){.me .nm,.chip-btn .cn{display:none}.top{gap:8px}.top-end{gap:6px;min-width:0}.langsel{max-width:84px;padding-inline:8px}.chip-btn{padding:0 9px}.bar{flex-wrap:wrap}.bar .search{flex:1 1 55%}.bar #bAdd{flex:1 1 100%;order:3}}

/* ================= v5: illustrations, hero, profile ================= */
.pic{display:grid;place-items:center;border-radius:18px;background:var(--g);flex:none;box-shadow:0 8px 18px -8px rgba(30,40,120,.5),inset 0 -3px 0 rgba(0,0,0,.08)}
.pic svg{width:74%;height:74%}
.g-seek{--g:linear-gradient(145deg,#7C9BFF,#3B4BFF)}
.g-job{--g:linear-gradient(145deg,#FFC25A,#FF7A18)}
.g-estate{--g:linear-gradient(145deg,#6FE3C1,#14A38B)}
.g-service{--g:linear-gradient(145deg,#C98BFF,#7C3AED)}
.g-msgs{--g:linear-gradient(145deg,#62D6FF,#0A84E0)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;overflow:visible}
.tab{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:20px;position:relative;font-weight:700}
.tab .pic{width:56px;height:56px;transition:transform .2s}
.tab .t{font-size:.86rem;text-align:center;line-height:1.2;white-space:normal}
.tab em{position:absolute;top:8px;inset-inline-end:8px;min-width:24px;height:24px;font-size:.78rem}
.tab[aria-selected=true] .pic{transform:translateY(-3px) scale(1.07)}
.hero-home{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin:6px 0 18px;color:#fff;background:linear-gradient(135deg,#2B3AE8 0%,#6A4CFF 55%,#B05BFF 100%);box-shadow:0 22px 40px -22px rgba(60,50,230,.7)}
.hero-home::before,.hero-home::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero-home::before{width:230px;height:230px;top:-100px;inset-inline-end:-60px}
.hero-home::after{width:150px;height:150px;bottom:-70px;inset-inline-start:30%;background:rgba(255,200,87,.25)}
.hero-home h2{margin:0;font-size:1.55rem;position:relative}
.hero-home .sub2{margin:4px 0 16px;opacity:.92;position:relative}
.qadd{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;position:relative}
.qadd button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;border:1.5px solid rgba(255,255,255,.38);background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:800;cursor:pointer;text-align:start}
.qadd button:hover{background:rgba(255,255,255,.28)}
.qadd .pic{width:42px;height:42px;border-radius:13px}
.empty .pic{width:104px;height:104px;margin:0 auto 12px;border-radius:30px}
.cover.ph{background:var(--g)}
.cover.ph svg{width:84px;height:84px}
.me{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;box-shadow:var(--shadow)}
[dir=rtl] .me{padding:3px 3px 3px 12px}
.me .av{width:36px;height:36px;border-radius:50%}
.me .nm{font-weight:800;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .mflag{font-size:1.1rem}
dialog#dlgP{padding:0;overflow:auto;max-height:92dvh}
#fP{display:block;padding:0}
.pf-banner{display:flex;align-items:center;gap:14px;padding:22px;background:linear-gradient(135deg,#2B3AE8,#7C5CFF 60%,#B05BFF);color:#fff}
.pf-av{width:70px;height:70px;border-radius:24px;display:grid;place-items:center;font-size:2rem;font-weight:800;background:hsl(var(--h,220) 85% 86%);color:#1b1b3a;border:3px solid rgba(255,255,255,.65);flex:none}
.pf-name{margin:0;font-size:1.35rem}
.pf-flag{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45);color:#fff;margin-top:6px;cursor:default;min-height:34px}
.pf-body{display:grid;gap:14px;padding:20px 24px 24px}
.pf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--field);border:1.5px solid var(--line)}
.pf-c{font-weight:800}
@media (max-width:760px){.tabs{grid-template-columns:repeat(3,1fr)}.tab .pic{width:52px;height:52px}.qadd{grid-template-columns:1fr 1fr}.qadd button{font-size:.85rem;padding:8px}.me .nm{display:none}.me{padding:3px}}
.g-car{--g:linear-gradient(145deg,#FF9A6B,#E5484D)}
.bm{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:hsl(var(--h,220) 62% 46%);color:#fff;font-weight:800;font-size:.7rem;letter-spacing:.02em;flex:none}
.bodygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.bodygrid button{--bgs:var(--field);display:grid;justify-items:center;align-content:start;gap:4px;padding:8px 4px 7px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);cursor:pointer;font-weight:700;font-size:.78rem;line-height:1.2;text-align:center;color:var(--ink)}
.bodygrid button svg{width:128px;max-width:100%;height:auto}
.bodygrid button[aria-pressed=true]{--bgs:var(--brand-soft);border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.demo{text-align:center}
@media (max-width:760px){.qadd button:last-child:nth-child(odd){grid-column:1/-1}}
.g-item{--g:linear-gradient(145deg,#FF8FB8,#D6336C)}
.bigemo{font-size:72px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.cover.ph .bigemo{display:block}
.itcats{display:grid;gap:12px;max-height:340px;overflow:auto;padding:2px}
.itgroup h5{margin:0 0 6px;font-size:.8rem;color:var(--muted);font-weight:800}
.itgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.itgrid button{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);cursor:pointer;font-weight:700;font-size:.76rem;line-height:1.2;text-align:center;color:var(--ink)}
.itgrid button .emo{font-size:2rem;line-height:1.15}
.itgrid button[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.itgrid button[hidden],.itgroup[hidden]{display:none}
#fEnter .phone{direction:ltr}
#fEnter .phone input{flex:1;direction:ltr;text-align:left}
#authLangs{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:22px 0 0}
#authLangs .lang-opt{min-height:38px;padding:0 6px;font-size:.84rem;border-radius:12px}
</style>

/* ---------------- generic combo box ---------------- */
function combo(root, { items, onPick, custom, onBlur }) {
  const input = $('input', root), ul = $('ul', root);
  let act = -1, shown = [];
  const open = () => { ul.hidden = false; input.setAttribute('aria-expanded', 'true'); };
  const close = () => { ul.hidden = true; input.setAttribute('aria-expanded', 'false'); act = -1; };
  function draw(q) {
    const nq = norm(q);
    shown = items().filter(i => !nq || i.s.includes(nq)).slice(0, 220);
    let html = '', last = null;
    shown.forEach((it, i) => {
      if (it.g && it.g !== last) { html += `<li class="grp" role="presentation">${esc(it.g)}</li>`; last = it.g; }
      html += `<li role="option" data-i="${i}">${it.pre ? `<span>${it.pre}</span>` : ''}<span class="lbl">${esc(it.l)}</span>${it.post ? `<bdi class="post" dir="ltr">${esc(it.post)}</bdi>` : ''}</li>`;
    });
    if (custom && q.trim() && !shown.some(i => norm(i.l) === nq))
      html += `<li role="option" class="cust" data-c="1">${esc(tr('use'))} “<b>${esc(q.trim())}</b>”</li>`;
    if (!html) html = `<li class="none">${esc(tr('none'))}</li>`;
    ul.innerHTML = html; act = -1;
  }
  function pick(li) {
    if (!li) return;
    if (li.dataset.c) onPick({ custom: input.value.trim() });
    else { const it = shown[+li.dataset.i]; input.value = it.v || it.l; onPick(it); }
    close();
  }
  input.addEventListener('focus', () => { input.select(); draw(''); open(); });
  input.addEventListener('input', () => { draw(input.value); open(); });
  ul.addEventListener('mousedown', e => { const li = e.target.closest('li[role=option]'); if (li) { e.preventDefault(); pick(li); } });
  input.addEventListener('blur', () => setTimeout(() => { close(); onBlur && onBlur(); }, 120));
  input.addEventListener('keydown', e => {
    const opts = $$('li[role=option]', ul);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (ul.hidden) { draw(input.value); open(); }
      const o2 = $$('li[role=option]', ul); if (!o2.length) return;
      act = (act + (e.key === 'ArrowDown' ? 1 : -1) + o2.length) % o2.length;
      o2.forEach((o, i) => o.classList.toggle('on', i === act)); o2[act].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && !ul.hidden && act >= 0) { e.preventDefault(); pick(opts[act]); }
    else if (e.key === 'Escape') { close(); }
  });
}

async function sha(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch { let out = 'x'; for (let k = 0; k < 8; k++) { let h = 5381 + k * 7919; for (const c of s) h = (Math.imul(h, 33) ^ c.charCodeAt(0)) | 0; out += (h >>> 0).toString(16).padStart(8, '0'); } return out; }
}

/* =====================================================================
   DATA LAYER  —  two interchangeable back ends with the same methods
   • FirebaseDB : real, shared by everyone (needs FIREBASE_CONFIG above)
   • LocalDB    : demo mode, everything stays in this browser
   ===================================================================== */
function LocalDB() {
  const L = {
    get(k, d) { try { const v = localStorage.getItem('jisr3.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { localStorage.setItem('jisr3.' + k, JSON.stringify(v)); }
  };
  const subs = new Set();
  const fire = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith('jisr3.')) fire(); });
  const watch = fn => { subs.add(fn); fn(); return () => subs.delete(fn); };
  let authCb = () => {}, pendingPh = '', code = '';
  const authUser = () => { const s = L.get('session', null); return s ? { uid: s.uid, email: s.email || '', phone: s.phone || '' } : null; };
  const login = s => { L.set('session', s); authCb(authUser()); };
  return {
    live: false,
    async ready() {},
    onAuth(cb) { authCb = cb; cb(authUser()); },
    async enterPhone(phone) { login({ uid: 'p_' + digitsOf(phone), phone }); },
    needsPw: false,
    async logout() { localStorage.removeItem('jisr3.session'); authCb(null); },
    async getProfile(id) { return L.get('users', {})[id] || null; },
    async saveProfile(id, patch) {
      const u = L.get('users', {}); const o = u[id] || {};
      u[id] = { ...o, ...patch, uid: id }; u[id].nameLower = norm(u[id].name || ''); L.set('users', u); fire(); return u[id];
    },
    async searchPeople(q) {
      const n = norm(q), d = digitsOf(q);
      return Object.values(L.get('users', {})).filter(u => (n && (u.nameLower || '').includes(n)) || (d.length >= 6 && (digitsOf(u.phone).includes(d) || digitsOf(u.wa).includes(d)))).slice(0, 30);
    },
    watchPosts(country, kind, cb) { return watch(() => cb(L.get('posts', []).filter(p => p.country === country && p.kind === kind).sort((a, b) => b.ts - a.ts))); },
    async addPost(post, images) {
      const id = newId(); post = { ...post, id }; const posts = L.get('posts', []); posts.unshift(post);
      const media = L.get('media', {}); if (images && images.length) media[id] = images;
      try { L.set('media', media); L.set('posts', posts); } catch (e) { throw { code: 'quota' }; }
      fire(); return id;
    },
    async setPost(id, patch) { L.set('posts', L.get('posts', []).map(p => p.id === id ? { ...p, ...patch } : p)); fire(); },
    async delPost(id, hasMedia) {
      L.set('posts', L.get('posts', []).filter(p => p.id !== id));
      const m = L.get('media', {}); delete m[id]; L.set('media', m);
      L.set('comments', L.get('comments', []).filter(c => c.postId !== id)); fire();
    },
    async getMedia(id) { return L.get('media', {})[id] || []; },
    watchComments(postId, cb) { return watch(() => cb(L.get('comments', []).filter(c => c.postId === postId).sort((a, b) => a.ts - b.ts))); },
    async addComment(c) { const all = L.get('comments', []); all.push({ ...c, id: newId(), ts: Date.now() }); L.set('comments', all); fire(); },
    async delComment(id) { L.set('comments', L.get('comments', []).filter(c => c.id !== id)); fire(); },
    watchChats(me, cb) { return watch(() => cb(Object.entries(L.get('chats', {})).filter(([, c]) => c.members.includes(me)).map(([k, c]) => ({ id: k, ...c })).sort((a, b) => (b.lastTs || 0) - (a.lastTs || 0)))); },
    watchMsgs(cid, cb) { return watch(() => cb(L.get('msgs', {})[cid] || [])); },
    async sendMsg(cid, from, to, names, text) {
      const chats = L.get('chats', {}), ts = Date.now(), c = chats[cid] || { members: [from, to], names: {}, seen: {} };
      c.names = { ...c.names, ...names }; c.last = text.slice(0, 80); c.lastTs = ts; c.lastFrom = from; c.seen = { ...c.seen, [from]: ts };
      chats[cid] = c; L.set('chats', chats);
      const m = L.get('msgs', {}); (m[cid] = m[cid] || []).push({ id: newId(), from, text, ts }); L.set('msgs', m); fire();
    },
    async markSeen(cid, me, ts) { const chats = L.get('chats', {}); if (!chats[cid]) return; chats[cid].seen = { ...chats[cid].seen, [me]: ts }; L.set('chats', chats); fire(); },
    async delChat(cid) { const chats = L.get('chats', {}); delete chats[cid]; L.set('chats', chats); const m = L.get('msgs', {}); delete m[cid]; L.set('msgs', m); fire(); }
  };
}

async function shrink(file, maxDim, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

    root.innerHTML = items.map((it, i) => `<div class="ph"><img src="${it.thumb}" alt=""><button type="button" data-rm="${i}" aria-label="remove">×</button></div>`).join('') + (items.length < max ? '<button type="button" class="addph" data-add aria-label="add photos">+</button>' : '');
  };
  root.addEventListener('click', e => {
    if (e.target.closest('[data-add]')) input.click();
    const r = e.target.closest('[data-rm]'); if (r) { items.splice(+r.dataset.rm, 1); draw(); }
  });
  input.addEventListener('change', async () => {
    for (const f of [...input.files].slice(0, max - items.length)) {
      try { items.push({ thumb: await shrink(f, 380, .6), full: await shrink(f, dim, q) }); } catch (err) { console.warn('image skipped', err); }
    }
    input.value = ''; draw();
  });
  draw();
  return {
    reset() { items = []; draw(); },
    pack() {
      const images = items.map(i => i.full);
      if (images.reduce((s, x) => s + x.length, 0) > 900000) return null;
      return { thumb: items[0] ? items[0].thumb : '', images, nimg: images.length };
    }
  };
}
function chipRow(root, onChange) {
  root.addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    const was = b.getAttribute('aria-pressed') === 'true', single = root.dataset.multi !== '1';
    if (single && root.dataset.opt !== '1') { $$('button', root).forEach(x => x.setAttribute('aria-pressed', x === b)); }
    else if (single) { $$('button', root).forEach(x => x.setAttribute('aria-pressed', x === b && !was)); }
    else b.setAttribute('aria-pressed', !was);
    onChange && onChange(get());
  });
  const get = () => { const b = $('button[aria-pressed=true]', root); return b ? b.dataset.v : ''; };
  return { get, set(v) { $$('button', root).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); } };
}

const intOrBlank = v => { v = String(v).trim(); return v === '' ? '' : Math.round(Number(v)); };
const numOrBlank = v => { v = String(v).trim(); return v === '' ? '' : Number(v); };
const inRange = (v, a, b) => v === '' || (Number.isFinite(v) && v >= a && v <= b);
const base = (kind, num) => ({ kind, country: user.country, owner: user.uid, ownerName: user.name, phone: num, wa: num, ts: Date.now(), commentsOff: false });
async function publish(btn, errSel, post, images, dlg) {
  busy(btn, true);
  try { await DB.addPost(post, images); dlg.close(); toast(tr('done')); }
  catch (err) { console.error(err); setErr(errSel, err && err.code === 'quota' ? 'photosBig' : 'net'); }
  busy(btn, false);
}

/* ---------------- language gate (shown first) ---------------- */
let gateFirst = false;
function buildGate() {
  $('#langGrid').innerHTML = LANGS.map(l => `<button type="button" class="lang-opt${l.c === lang ? ' on' : ''}" data-l="${l.c}" lang="${l.c}" dir="${l.rtl ? 'rtl' : 'ltr'}">${esc(l.n)}</button>`).join('');
}
function openGate(first) {
  gateFirst = !!first; buildGate(); $('#gateX').hidden = gateFirst; $('#langGate').hidden = false; document.body.style.overflow = 'hidden';
  setTimeout(() => { const on = $('#langGrid .on'); if (on) on.focus(); }, 50);
}
function closeGate() { store.set('lang', lang); $('#langGate').hidden = true; document.body.style.overflow = ''; gateFirst = false; }
$('#langGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-l]'); if (!b) return;
  lang = b.dataset.l; store.set('lang', lang); applyLang();
  $$('#langGrid .lang-opt').forEach(x => x.classList.toggle('on', x === b));
});
$('#gateGo').addEventListener('click', closeGate);
$('#gateX').addEventListener('click', closeGate);
$('#langPill').addEventListener('click', () => openGate(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#langGate').hidden && !gateFirst) closeGate(); });

  catch (err) { console.error(err); $('#demoNote').hidden = false; $('#demoNote').textContent = tr('liveErr'); }
})();
